const INSTALL_KEY = "acorn-fortune-install", TOAST_DELAY_MS = 1200, DONE_SHOW_MS = 3000, TOAST_DAYS = 2;
const INSTALL_ASK = "홈에 도토리를 심을까요?", INSTALL_DONE = "홈 화면에 도토리를 심었어요";
const canInstall = () => !installed() && (installPrompt || isKakao || (isIos && !inAppBrowser));
let toastTimer = 0, toastWatch = null;
function hideToast(forever) {
  clearTimeout(toastTimer);
  toastWatch?.abort();
  $("install-toast").hidden = true;
  if (forever) saveJson(INSTALL_KEY, { ...loadJson(INSTALL_KEY), off: true });
}
function showToast(text, withButtons, ms) {
  const toast = $("install-toast"), card = $("result").getBoundingClientRect();
  $("install-text").textContent = text;
  $("install").hidden = $("install-close").hidden = !withButtons;
  $("install-icon").toggleAttribute("hidden", withButtons);
  // 점괘 카드와 같은 폭·같은 가로 위치에 맞춘다. 넓은 화면에서는 카드가 오른쪽 칸에 있다.
  // 주소창 아이콘으로 설치하면 카드가 아직 없을 수 있어 그때는 글자 폭으로 가운데에 띄운다.
  toast.style.setProperty("--toast-w", card.width ? `${card.width}px` : "max-content");
  toast.style.left = card.width ? `${card.left + card.width / 2}px` : "";
  toast.hidden = false;
  if (!reduceMotion) toast.animate(stepped([-24, -12, -4, 0].map(y => ({ translate: `0 ${y}px`, opacity: y ? 0.5 : 1 }))), { duration: 240 });
  clearTimeout(toastTimer);
  toastWatch?.abort();
  if (ms) { toastTimer = setTimeout(() => hideToast(false), ms); return; }
  // 묻는 토스트는 시간으로 닫지 않는다. 점괘를 읽는 동안 남아 있다가 다른 곳을 만지거나 스크롤하면 닫힌다.
  toastWatch = new AbortController();
  const { signal } = toastWatch;
  addEventListener("pointerdown", e => { if (!toast.contains(e.target)) hideToast(false); }, { signal });
  addEventListener("scroll", () => hideToast(false), { signal, passive: true });
}
async function installToast() {
  const seen = loadJson(INSTALL_KEY) ?? {};
  const days = seen.days ?? [];
  if (seen.off || days.includes(todayKey()) || days.length >= TOAST_DAYS) return;
  await wait(TOAST_DELAY_MS);
  if (!canInstall() || document.body.classList.contains("endless") || document.body.classList.contains("planting")) return;
  saveJson(INSTALL_KEY, { ...seen, days: [...days, todayKey()] });
  showToast(INSTALL_ASK, true, 0);
}

// 카카오톡 브라우저는 홈 화면에 추가할 수 없어 바깥 브라우저로 넘긴다.
// 안드로이드는 Chrome 으로 연다. 기본 브라우저가 삼성 인터넷이면 설치 창을 띄울 수 없고 다크모드에서 색을 뒤집는다.
// 저장소가 브라우저마다 따로라 오늘 점괘·랭킹 아이디를 주소에 실어 같은 사람으로 이어지게 한다.
// intent 주소는 # 뒤를 Intent 설정으로 쓰므로 값은 검색어로 싣는다.
const CARRY_KEYS = [STORE_KEY, PLAYER_KEY, ENDLESS_KEY], PLANT_PARAM = "plant";
const isAndroid = /Android/i.test(navigator.userAgent);
function openOutside() {
  const carry = Object.fromEntries(CARRY_KEYS.map(k => [k, localStorage.getItem(k)]).filter(([, v]) => v));
  const query = `?${PLANT_PARAM}=${encodeURIComponent(JSON.stringify(carry))}`;
  location.href = isAndroid
    ? `intent://${location.host}${location.pathname}${query}#Intent;scheme=https;package=com.android.chrome;end`
    : `kakaotalk://web/openExternal?url=${encodeURIComponent(location.origin + location.pathname + query)}`;
}
// 넘어온 주소면 실어 온 값을 저장하고 주소를 지운다. 이미 설치한 사람에게는 심기 화면을 띄우지 않는다.
function takePlant() {
  const raw = new URLSearchParams(location.search).get(PLANT_PARAM);
  if (raw === null) return false;
  try {
    const carry = JSON.parse(raw);
    CARRY_KEYS.forEach(k => { if (typeof carry[k] === "string") localStorage.setItem(k, carry[k]); });
  } catch {}
  history.replaceState(null, "", location.pathname);
  return !installed();
}
let planted = false;
function renderPlant() {
  if ($("plant").hidden) return;
  $("plant-title").textContent = planted ? "도토리를 심었어요" : "홈 화면에 도토리 심기";
  $("plant-lead").textContent = planted ? "이제 홈 화면의 도토리를 누르면 바로 열려요." : "한 번 심어 두면 다음부터는 홈 화면에서 바로 열 수 있어요.";
  $("plant-go").hidden = planted;
}
function showPlant() {
  const bottom = WHOLE.findLastIndex(row => row.some(Boolean));
  const art = $("plant-art"), pad = 6, w = GRID_W + 2 * pad, soil = bottom - 4, h = bottom + 4;
  art.setAttribute("viewBox", `0 0 ${w} ${h}`);
  art.style.setProperty("--plant-w", w);
  WHOLE.forEach((row, y) => row.forEach((c, x) => { if (c) addRect(art, x + pad, y, 1, 1, `var(${COLORS[c]})`); }));
  // 도토리 아랫부분을 흙 둔덕이 덮어 심긴 것처럼 보이게 한다. 윗줄일수록 좁다.
  [8, 5, 3, 1, 0, 0, 0, 0].forEach((inset, y) => {
    addRect(art, inset, soil + y, w - 2 * inset, 1, "var(--stem)");
    addRect(art, inset, soil + y, 1, 1, "var(--outline)");
    addRect(art, w - inset - 1, soil + y, 1, 1, "var(--outline)");
  });
  addRect(art, 8, soil, w - 16, 1, "var(--outline)");
  [[7, 2], [12, 4], [19, 2], [23, 5], [4, 6], [16, 6], [27, 6]].forEach(([x, y]) => addRect(art, x, soil + y, 2, 1, "var(--cap)"));
  document.body.classList.add("planting");
  $("plant").hidden = false;
  renderPlant();
}
// 설치 창을 띄울 수 없는 브라우저(아이폰, 처음 연 사이트를 아직 허락하지 않은 Chrome 등)는 직접 추가하는 방법을 연다.

/* ---------- 화면 배경 ---------- */

const LEAF = ["..XX.", ".XXXX", "XXXX.", ".XX..", "X...."];
const SPRIG = ["X.X.X", ".XXX.", "..X.."];
const PEBBLES = ["XX..", "XX.X"];
const BG_CELL = 2 * PX;
// 무늬 하나가 차지하는 넓이(px²). 클수록 듬성하다.
const BG_DECO_AREA = 140 * 140;
const FALLING_LEAVES = 6;
const LEAF_COLORS = ["--acorn-light", "--cap-light", "--ground-light"];

// 창 크기가 바뀌어도 무늬 자리가 뒤섞이지 않게 고정된 씨앗으로 뽑는다.
function seeded(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function drawSprite(svg, art, x, y, u, color, flip) {
  art.forEach((row, ry) => [...row].forEach((ch, rx) => {
    if (ch !== "X") return;
    addRect(svg, x + (flip ? row.length - 1 - rx : rx) * u, y + ry * u, u, u, color);
  }));
}

// 나무 꼭대기를 반원으로 겹쳐 숲 능선을 만든다. 열마다 가장 높은 값 하나만 그린다.
function woodLine(svg, w, h, rnd, color, minR, maxR, lift) {
  const cols = Math.ceil(w / BG_CELL), tops = new Array(cols).fill(0);
  for (let c = -maxR; c < cols + maxR; c += Math.round((minR + rnd() * (maxR - minR)) * 0.9)) {
    const r = Math.round(minR + rnd() * (maxR - minR));
    for (let dx = -r; dx <= r; dx++) {
      const col = c + dx;
      if (col < 0 || col >= cols) continue;
      tops[col] = Math.max(tops[col], Math.round(Math.sqrt(r * r - dx * dx)) + lift);
    }
  }
  tops.forEach((t, col) => addRect(svg, col * BG_CELL, h - t * BG_CELL, BG_CELL, t * BG_CELL, color));
}

function drawBackdrop() {
  document.querySelector(".backdrop")?.remove();
  const w = innerWidth, h = innerHeight, rnd = seeded(20261019);
  const layer = Object.assign(document.createElement("div"), { className: "backdrop" });
  layer.setAttribute("aria-hidden", "true");
  const svg = svgEl(w, h);

  const decos = [LEAF, SPRIG, PEBBLES];
  for (let i = 0, n = Math.round(w * h / BG_DECO_AREA); i < n; i++) {
    const x = snap(rnd() * w, BG_CELL / 2), y = snap(rnd() * h * 0.85, BG_CELL / 2);
    drawSprite(svg, decos[i % decos.length], x, y, PX, "var(--bg-deco)", rnd() < 0.5);
  }
  woodLine(svg, w, h, rnd, "var(--wood-far)", 6, 12, 8);
  woodLine(svg, w, h, rnd, "var(--wood-near)", 4, 9, 3);
  layer.append(svg);

  if (!reduceMotion) {
    for (let i = 0; i < FALLING_LEAVES; i++) {
      const leaf = svgEl(LEAF[0].length * PX, LEAF.length * PX);
      drawSprite(leaf, LEAF, 0, 0, PX, `var(${LEAF_COLORS[i % LEAF_COLORS.length]})`, i % 2);
      leaf.style.left = `${snap((i + 0.5) / FALLING_LEAVES * w + rand(-40, 40))}px`;
      layer.append(leaf);
      const sway = rand(30, 70) * (i % 2 ? 1 : -1);
      leaf.animate([
        { transform: `translate(0, -40px)` },
        { transform: `translate(${sway}px, ${h * 0.35}px)` },
        { transform: `translate(${-sway / 2}px, ${h * 0.7}px)` },
        { transform: `translate(${sway / 2}px, ${h + 40}px)` },
      ], { duration: rand(14000, 24000), delay: -rand(0, 24000), iterations: Infinity, easing: "steps(90, end)" });
    }
  }
  document.body.prepend(layer);
}

let backdropSize = "";
addEventListener("resize", () => requestAnimationFrame(() => {
  const size = `${innerWidth}x${innerHeight}`;
  if (size === backdropSize) return;
  backdropSize = size;
  drawBackdrop();
}));

// 글꼴이 늦게 들어오거나 창 크기가 바뀌면 무대 크기가 달라지므로 그때마다 다시 그린다.
let stageSize = "";
new ResizeObserver(() => requestAnimationFrame(() => {
  const size = `${stage.clientWidth}x${stage.clientHeight}`;
  if (busy || size === stageSize) return;
  stageSize = size;
  relayout();
})).observe(stage);

setFavicon();
backdropSize = `${innerWidth}x${innerHeight}`;
drawBackdrop();
sizeAcorn();
drawScene();
const planting = takePlant();
today = loadToday();
acornType = today ? acornById(today.type) : FORTUNES[dayFortune()][0] === "천운" ? GOLDEN_ACORN : pick(ACORN_TYPES);
acorn.classList.add(acornType.id);
const lastRun = loadJson(ENDLESS_KEY);
if (today && lastRun?.date === todayKey() && lastRun.open && lastRun.run) resumeEndless(lastRun.run);
else if (today) showToday();
else {
  resetAcorn();
  if (isGolden()) {
    auraSwell(1.5);
    particles(stage.clientWidth / 2, acornTop() + 6 * CELL, "--crown", 12, 14 * CELL);
  }
  gauge.speed = acornType.speed;
  gauge.newZone(true);
  gauge.start();
}
if (planting) showPlant();
